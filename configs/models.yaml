online_retail_forecasting:
  frequency: "D"
  horizon_days: 14
  test_days: 28
  models:
    naive_seasonal:
      type: "NaiveSeasonal"
      season_length: 7
    exponential_smoothing:
      type: "ExponentialSmoothing"
      trend: "add"
      seasonal: "add"
      seasonal_periods: 7
    sarimax:
      type: "SARIMAX"
      order: [1, 1, 1]
      seasonal_order: [1, 1, 1, 7]
