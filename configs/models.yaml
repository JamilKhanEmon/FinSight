marketing_response:
  target: "y"
  positive_label: "yes"
  eval_metric: "pr_auc"
  cv_folds: 5
  random_state: 42
  models:
    dummy:
      type: "DummyClassifier"
      params:
        strategy: "prior"
    logistic_regression:
      type: "LogisticRegression"
      params:
        max_iter: 1000
        class_weight: "balanced"
        solver: "lbfgs"
        random_state: 42
    random_forest:
      type: "RandomForestClassifier"
      params:
        n_estimators: 100
        max_depth: 8
        min_samples_split: 10
        class_weight: "balanced"
        n_jobs: 4
        random_state: 42
    xgboost:
      type: "XGBClassifier"
      params:
        n_estimators: 100
        max_depth: 5
        learning_rate: 0.08
        eval_metric: "logloss"
        scale_pos_weight: 7.0
        n_jobs: 4
        random_state: 42

